name: Bug report
description: Something is broken or behaves differently than documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documents / preview
        - Projects / access control
        - Files
        - Prompts
        - Auth / API tokens
        - Realtime / notifications
        - MCP server
        - Deployment / Docker
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit hash or release you are running.
      placeholder: e.g. 28ab39d
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you run Dockia (Docker / local dev), OS, and browser.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets, tokens, or private document content first.
      render: shell
