name: CI / Deploy

# Checks run on every push and PR to main. Deploy runs only after checks pass
# on a push to main (or a manual "Run workflow").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Don't let two runs for the same ref overlap (avoids racing deploys).
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system check + missing-migration check
        env:
          DJANGO_SETTINGS_MODULE: config.settings_sqlite
          DJANGO_SECRET_KEY: ci-not-a-real-secret
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: API smoke test
        env:
          DJANGO_SETTINGS_MODULE: config.settings_sqlite
          DJANGO_SECRET_KEY: ci-not-a-real-secret
        run: |
          python manage.py migrate --noinput
          python smoke_test.py

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    name: Deploy to server
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Forks and fresh clones have no deploy secrets; treat that as "no
          # server to deploy to" rather than a failed run.
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::notice::Deploy secrets are not configured; skipping deploy."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "cd '${DEPLOY_PATH:-/opt/dockia}' && bash scripts/deploy.sh"
