worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    # 0 = no limit on request body size (unbounded document uploads).
    client_max_body_size 0;
    server_tokens off;

    # --- Rate limiting zones ---
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:3000; }
    upstream ws       { server ws:8001; }

    server {
        # TLS terminated here with a self-signed cert (see scripts/gen-selfsigned-cert.sh).
        # Browsers warn until the cert is trusted on each client — expected for self-signed.
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/dockia.crt;
        ssl_certificate_key /etc/nginx/certs/dockia.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:5m;
        ssl_session_timeout 1h;

        # --- Security headers (defense in depth; app also sets its own) ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # HSTS left OFF for self-signed TLS: pinning HTTPS while the cert is
        # untrusted can lock clients out. Enable only with a CA-trusted cert.
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # --- Auth endpoints: strict rate limit ---
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params_internal;
        }

        # --- API ---
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params_internal;
        }

        # --- Realtime websockets → Daphne (ASGI) ---
        location /ws/ {
            proxy_pass http://ws;
            include /etc/nginx/proxy_params_internal;  # sets Upgrade/Connection
            proxy_read_timeout 86400s;                 # keep long-lived sockets open
        }

        # --- Django admin + DRF browsable (optional, same backend) ---
        location /django-admin/ {
            proxy_pass http://backend;
            include /etc/nginx/proxy_params_internal;
        }

        # --- Collected Django static (admin, DRF) ---
        location /static/ {
            alias /var/www/static/;
            expires 7d;
            access_log off;
        }

        # --- Uploaded media is NEVER served directly. ---
        # Raw HTML must go through the sanitizing API so it cannot be
        # rendered as an active document on this origin. Block direct access.
        location /media/ {
            internal;
        }

        # --- Internal handoff for authorized file downloads (X-Accel-Redirect). ---
        # Only reachable when the backend sets the X-Accel-Redirect header after
        # validating the signed download token; never directly from the client.
        location /protected-media/ {
            internal;
            alias /var/www/media/;
        }

        # --- Next.js frontend (everything else) ---
        location / {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_params_internal;
        }
    }
}
